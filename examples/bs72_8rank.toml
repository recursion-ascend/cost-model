# 8 卡, 每卡 72 token, topk=6, 均匀路由, MTE 路径.
# 运行: python examples/run_bs72_8rank.py
#
# 路由矩阵由 routing = "uniform" 生成, 同一份矩阵另存在 bs72_8rank_routing.json:
#   每个源 rank 发 72 × 6 = 432 行, 均分到 8 × 3 = 24 个专家 → C[dst][expert][src] = 18
#   每个专家共收 18 × 8 = 144 行, 每张卡共收 432 行

profile = "megamoe-a8w8"   # 以那份实现的取值为底 (缺省是"最少假设", 不复现任何实现)
name = "bs72-8rank-topk6"
h = 5120
hidden_dim = 4608            # = 2 x 中间维 (SwiGLU 的 gate + up), 即中间维 2304。
                             # 注意: 本文件原写 4608 并注成 "intermediate" —— 口径错了,
                             # hidden_dim 是 GMM1 的输出宽度 = 2I (见 analysis/bounds.py),
                             # 所以那个值建模的中间维是 2304。取值不变, 只把口径写对;
                             # 要建模中间维 4608 请写 hidden_dim = 9216。
aic_num = 28
p1_override = 2              # 小 batch 档 (token < 2048) 的 kernel 取值
p2_override = 1

[workload]
tokens = 72
topk = 6
world = 8
local_experts = 3
routing = "uniform"

[calibration]
# 必填, 无缺省. 占位值, 没有实测依据; run_bs72_8rank.py 会扫三档.
cube_mac_per_us = 2.7e7

[kernel]
topo_urma = false            # MTE 波循环
