# 4 卡, 每卡 36 token, topk=6, 均匀路由, A8W8 wave (MTE) 路径, 不带共享专家.
# 运行: python tools/make_report.py examples/bs36_4rank.toml
#
#   每卡发出 36 x 6 = 216 行, 均分到 4 x 3 = 12 个专家 -> 每格 18 行
#   每个专家收 18 x 4 = 72 行, 每卡收 216 行

name = "bs36-4rank-topk6"
h = 5120
hidden_dim = 9216            # kernel 的 hiddenDim = 2 x intermediate (SwiGLU gate+up)
aic_num = 28
# p1/p2 是主机侧策略, tiling 里没有, 只能手填; 但 [tiling] 会用它们重算
# mGroupsPerWave 与真值核对 —— 抄错或随 kernel 改版失效都会直接报错。
p1_override = 2
p2_override = 1

[tiling]
# kernel 真值来源: 形状逐字段核对, 行级软流水槽数与路由批大小直接采用。
# 路径相对本场景文件所在目录 (与 workload.file 同规则); 换 run 只改这一行。
path = "../20260930_104026_183038_bs36_h5120_i4608_k6_cyclic/raw/tiling_rank0.bin"

[workload]
tokens = 36
topk = 6
world = 4
local_experts = 3
routing = "uniform"
shared_expert_num = 0        # 不带共享专家

[calibration]
# 不给 cube_mac_per_us = 不计计算项: 实测显示 GMM1/GMM2 都是权重载入绑定

[kernel]
topo_urma = false            # A8W8 MTE 波循环
