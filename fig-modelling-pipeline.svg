  <text x="340.5" y="39" font-size="5.6" text-anchor="middle" font-style="italic">expert</text>
  <text x="200" y="78" font-size="6.0" text-anchor="middle">one event per tile:  d(e) = max( MAC(e)/rate_cube ,  bytes(e)/BW(link) )   — compute and movement are two costs of the same event, not two boxes</text>
  <path d="M0 90 L396 90" fill="none" stroke="#bbb" stroke-width="0.4"/>
