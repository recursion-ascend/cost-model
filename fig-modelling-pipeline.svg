  <text x="276.0" y="236" font-size="7.0" text-anchor="middle">T̂</text>
  <text x="276.0" y="261" font-size="5.4" text-anchor="middle" font-style="italic" fill="#333">reported makespan</text>
  <path d="M208.8 245.5 L276.0 245.5" fill="none" stroke="#000" stroke-width="0.5"/>
  <text x="242.4" y="243.5" font-size="5.4" text-anchor="middle" font-style="italic">orchestration cost</text>
  <text x="322" y="250.2" font-size="5.6" text-anchor="start">the three bounds move only with the shape;</text>
  <text x="322" y="257" font-size="5.6" text-anchor="start">T̂ below any of them ⇒ BoundViolation</text>
  <rect x="4" y="262" width="182" height="34" fill="none" stroke="#666" stroke-width="0.5" stroke-dasharray="2.5 1.5"/>
  <text x="10" y="272" font-size="5.9" text-anchor="start">idle on a pooled role is split per core:</text>
  <text x="10" y="280" font-size="5.9" text-anchor="start">forced  (no ready work existed)  — admissible</text>
  <text x="10" y="288" font-size="5.9" text-anchor="start">avoidable  (ready work existed)  ⇒ WorkConservationViolation</text>
  <rect x="196" y="262" width="196" height="34" fill="none" stroke="#666" stroke-width="0.5" stroke-dasharray="2.5 1.5"/>
  <text x="202" y="272" font-size="5.9" text-anchor="start">colocation-pinned roles are excluded by derivation,</text>
  <text x="202" y="280" font-size="5.9" text-anchor="start">not by exception: a role carrying colocate_with or</text>
  <text x="202" y="288" font-size="5.9" text-anchor="start">core_group cannot take the ready tile it sees.</text>
  <rect x="96" y="308" width="204" height="18" fill="none" stroke="#000" stroke-width="0.6"/>
  <text x="198" y="319.5" font-size="6.0" text-anchor="middle">change exactly one knob — tile size, wave split, steal driver, binding — and re-run</text>
  <path d="M96 317 L60 317" fill="none" stroke="#444" stroke-width="0.6" stroke-dasharray="2.5 1.5" marker-end="url(#ag)"/>
  <path d="M60 317 L40 317" fill="none" stroke="#444" stroke-width="0.6" stroke-dasharray="2.5 1.5"/>
  <path d="M40 317 L40 56" fill="none" stroke="#444" stroke-width="0.6" stroke-dasharray="2.5 1.5"/>
  <path d="M40 56 L46 49" fill="none" stroke="#444" stroke-width="0.6" stroke-dasharray="2.5 1.5" marker-end="url(#ag)"/>
  <path d="M300 317 L320 317" fill="none" stroke="#444" stroke-width="0.6" stroke-dasharray="2.5 1.5"/>
  <path d="M320 317 L320 262" fill="none" stroke="#444" stroke-width="0.6" stroke-dasharray="2.5 1.5" marker-end="url(#ag)"/>
  <text x="198" y="334" font-size="6.0" text-anchor="middle">ΔT̂ between two runs is the cost of that one choice; the bounds and the idle test hold for both, so the difference is comparable and not an artefact of the simulator.</text>
  <text x="198" y="344" font-size="6.0" text-anchor="middle">No run is calibrated against the other: both are scheduled from the same declarations, so a win here is a win in the orchestration, not in the fit.</text>
