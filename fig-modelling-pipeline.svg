  <text x="2" y="11" font-size="7.6" text-anchor="start" font-style="italic">(a)</text>
  <text x="14" y="11" font-size="6.6" text-anchor="start">one tiling choice lowers the operator into tile events; a stage is a vocabulary entry, not a box in the code</text>
  <rect x="4" y="18" width="86" height="62" fill="none" stroke="#666" stroke-width="0.5" stroke-dasharray="2.5 1.5"/>
  <text x="47" y="27" font-size="6.0" text-anchor="middle" font-style="italic" fill="#333">declared, never hard-coded</text>
  <text x="8" y="36.0" font-size="5.9" text-anchor="start">shape  bs/rank, h, I, topk, routing</text>
  <text x="8" y="43.4" font-size="5.9" text-anchor="start">hardware  28 AIC, 2 AIV/core,</text>
  <text x="8" y="50.8" font-size="5.9" text-anchor="start">   BW_L1_GM, BW_UB, BW_REMOTE</text>
  <text x="8" y="58.2" font-size="5.9" text-anchor="start">orchestration  tile size, wave</text>
  <text x="8" y="65.6" font-size="5.9" text-anchor="start">   split, steal, late binding</text>
  <text x="8" y="73.0" font-size="5.9" text-anchor="start">stage vocabulary  per implementation</text>
