  <text x="14" y="199" font-size="6.0" text-anchor="start">start(e) = least t ≥ max{ max</text>
  <text x="80" y="201" font-size="4.8" text-anchor="start">p∈P(e)</text>
  <text x="97" y="199" font-size="6.0" text-anchor="start">[ end(p)+λ(e,p) ] ,  max</text>
  <text x="173" y="201" font-size="4.8" text-anchor="start">r∈R(e)</text>
  <text x="190" y="199" font-size="6.0" text-anchor="start">free(r) } admitted by the credits A(e) still holds;  concrete resources take the max, pool placeholders the min (late binding).</text>
