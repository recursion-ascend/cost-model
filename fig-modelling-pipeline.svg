  <text x="2" y="222" font-size="7.6" text-anchor="start" font-style="italic">(c)</text>
  <text x="14" y="222" font-size="6.6" text-anchor="start">the schedule is only accepted if it sits above every shape-determined bound and leaves no recoverable idle</text>
