<svg xmlns="http://www.w3.org/2000/svg" width="400pt" height="548pt" viewBox="0 0 400 548" font-family="Times New Roman, Times, serif" fill="#000">
  <defs>
    <marker id="a" viewBox="0 0 8 6" refX="7.4" refY="3" markerWidth="5.2" markerHeight="3.8" orient="auto">
      <path d="M0 0 L8 3 L0 6 z" fill="#000"/></marker>
    <marker id="ag" viewBox="0 0 8 6" refX="7.4" refY="3" markerWidth="4.8" markerHeight="3.4" orient="auto">
      <path d="M0 0 L8 3 L0 6 z" fill="#666"/></marker>
  </defs>
  <text x="2" y="10" font-size="7.4" text-anchor="start" font-style="italic">(a)</text>
  <text x="14" y="10" font-size="6.6" text-anchor="start">路由决定每个专家收多少行, 切 tile 决定有多少份活, 一份活就是一个事件</text>
  <text x="8" y="26" font-size="6.0" text-anchor="start">路由计数</text>
  <rect x="8" y="30" width="52" height="24" fill="none" stroke="#000" stroke-width="0.6"/>
  <text x="34" y="40" font-size="5.4" text-anchor="middle">C[卡][专家][源卡]</text>
  <text x="34" y="49" font-size="5.2" text-anchor="middle" fill="#333">→ 每专家收到的行数</text>
  <path d="M62 42 L76 42" fill="none" stroke="#666" stroke-width="0.6" marker-end="url(#ag)"/>
  <text x="78" y="26" font-size="6.0" text-anchor="start">按 TILE_M / TILE_N 切</text>
  <rect x="78" y="30" width="18" height="12" fill="#e8e8e8" stroke="#000" stroke-width="0.5"/>
  <rect x="96" y="30" width="18" height="12" fill="none" stroke="#000" stroke-width="0.5"/>
  <rect x="114" y="30" width="18" height="12" fill="none" stroke="#000" stroke-width="0.5"/>
  <rect x="78" y="42" width="18" height="12" fill="none" stroke="#000" stroke-width="0.5"/>
  <rect x="96" y="42" width="18" height="12" fill="none" stroke="#000" stroke-width="0.5"/>
  <rect x="114" y="42" width="18" height="12" fill="none" stroke="#000" stroke-width="0.5"/>
  <text x="87.0" y="38.0" font-size="4.8" text-anchor="middle">tile</text>
  <path d="M78 57 L132 57" fill="none" stroke="#666" stroke-width="0.4"/>
  <text x="105.0" y="64" font-size="5.0" text-anchor="middle" fill="#333">n-tile 方向 (TILE_N)</text>
  <text x="76" y="42" font-size="5.0" text-anchor="end" fill="#333">m-group</text>
  <text x="76" y="49" font-size="5.0" text-anchor="end" fill="#333">(TILE_M)</text>
  <text x="142" y="34" font-size="5.6" text-anchor="start">一个 tile = 一份活 = 一个事件</text>
  <text x="142" y="42" font-size="5.4" text-anchor="start" fill="#333">GMM1 的 n-tile 数按 hidden_dim/2 算 (SwiGLU 两块权重),</text>
  <text x="142" y="49" font-size="5.4" text-anchor="start" fill="#333">GMM2 按 h 算, 两者不同</text>
  <text x="142" y="59" font-size="5.4" text-anchor="start" fill="#333">dispatch 不是一行一个事件 —— 行在软流水里重叠,</text>
  <text x="142" y="66" font-size="5.4" text-anchor="start" fill="#333">一段连续行 (同源卡同目的) 作为一份活</text>
  <text x="8" y="78" font-size="6.0" text-anchor="start">波: m-group 分批投放, 一波装几个由"每核至少领到几个 tile"反推</text>
  <text x="8" y="88" font-size="5.6" text-anchor="start" fill="#333">粒度: 也可以把相邻几个 tile 合成一份活 —— 少几次同步, 但这份活只能占一个核, 且要等里面最后一个 tile 算完</text>
  <text x="8" y="106" font-size="6.2" text-anchor="start">依赖边 = 同一专家、同一块行列范围, 前一阶段交给后一阶段</text>
  <rect x="20" y="114" width="32" height="12" fill="none" stroke="#000" stroke-width="0.6"/>
  <text x="36" y="122.5" font-size="5.4" text-anchor="middle">GMM1</text>
  <text x="36" y="133" font-size="5.0" text-anchor="middle" fill="#333">行 [0,256) 列 [0,256)</text>
  <path d="M54 120 L76 120" fill="none" stroke="#000" stroke-width="0.6" marker-end="url(#a)"/>
  <rect x="78" y="114" width="32" height="12" fill="none" stroke="#000" stroke-width="0.6"/>
  <text x="94" y="122.5" font-size="5.4" text-anchor="middle">ACT</text>
  <text x="94" y="133" font-size="5.0" text-anchor="middle" fill="#333">行 [0,256) 列 [0,256)</text>
  <text x="65" y="116" font-size="6.2" text-anchor="middle">✓</text>
  <rect x="196" y="114" width="32" height="12" fill="none" stroke="#000" stroke-width="0.6"/>
  <text x="212" y="122.5" font-size="5.4" text-anchor="middle">GMM1</text>
  <text x="212" y="133" font-size="5.0" text-anchor="middle" fill="#333">行 [256,512) 列 [0,256)</text>
  <path d="M230 120 L252 120" fill="none" stroke="#999" stroke-width="0.6" stroke-dasharray="2 1.6"/>
  <path d="M238 116 L244 124" fill="none" stroke="#000" stroke-width="0.6"/>
  <path d="M244 116 L238 124" fill="none" stroke="#000" stroke-width="0.6"/>
  <rect x="254" y="114" width="32" height="12" fill="none" stroke="#000" stroke-width="0.6"/>
  <text x="270" y="122.5" font-size="5.4" text-anchor="middle">ACT</text>
  <text x="270" y="133" font-size="5.0" text-anchor="middle" fill="#333">行 [0,256) 列 [0,256)</text>
  <text x="241" y="110" font-size="5.0" text-anchor="middle" fill="#333">行范围不同</text>
  <text x="292" y="119" font-size="5.2" text-anchor="start" fill="#333">列对上但行没对上, 是并排的两块</text>
  <text x="292" y="126" font-size="5.2" text-anchor="start" fill="#333">数据, 不该连</text>
  <text x="8" y="146" font-size="5.6" text-anchor="start">GMM2 是唯一一个可以只等一部分的: 它沿 K 累加, 第 j 段只等覆盖这段 K 的 ACT 算完; 其余三条边都要整块对齐。</text>
  <path d="M0 158 L400 158" fill="none" stroke="#bbb" stroke-width="0.4"/>
  <text x="2" y="172" font-size="7.4" text-anchor="start" font-style="italic">(b)</text>
  <text x="14" y="172" font-size="6.6" text-anchor="start">每个事件记五件事, 其中两件不是"等谁算完"</text>
  <rect x="10" y="180" width="96" height="58" fill="none" stroke="#000" stroke-width="0.7"/>
  <text x="58" y="190" font-size="6.2" text-anchor="middle">一个事件记什么</text>
  <text x="16" y="201" font-size="5.4" text-anchor="start">落哪个核</text>
  <text x="58" y="201" font-size="5.4" text-anchor="start" fill="#333">AIC / AIV0 / AIV1</text>
  <text x="16" y="209" font-size="5.4" text-anchor="start">等哪些前驱</text>
  <text x="58" y="209" font-size="5.4" text-anchor="start" fill="#333">上一阶段同块数据</text>
  <text x="16" y="217" font-size="5.4" text-anchor="start">占几个缓冲槽</text>
  <text x="58" y="217" font-size="5.4" text-anchor="start" fill="#333">L1 / UB 的槽位</text>
  <text x="16" y="225" font-size="5.4" text-anchor="start">是否必须同核</text>
  <text x="58" y="225" font-size="5.4" text-anchor="start" fill="#333">Fixpipe 直给时</text>
  <text x="16" y="233" font-size="5.4" text-anchor="start">算多久</text>
  <text x="58" y="233" font-size="5.4" text-anchor="start" fill="#333">见 (c) 下方四类公式</text>
  <text x="122" y="190" font-size="6.0" text-anchor="start">缓冲槽 (深度 D): GMM1 写 UB, ACT 读完才释放</text>
  <rect x="122" y="196" width="32" height="12" fill="none" stroke="#000" stroke-width="0.6"/>
  <text x="138" y="204.5" font-size="5.4" text-anchor="middle">GMM1</text>
  <rect x="180" y="196" width="32" height="12" fill="none" stroke="#000" stroke-width="0.6"/>
  <text x="196" y="204.5" font-size="5.4" text-anchor="middle">ACT</text>
  <path d="M156 202 L178 202" fill="none" stroke="#444" stroke-width="0.5" stroke-dasharray="1.8 1.4" marker-end="url(#a)"/>
  <text x="167" y="198" font-size="5.2" text-anchor="middle">槽</text>
  <text x="122" y="217" font-size="5.4" text-anchor="start" fill="#333">第 i+D 个 GMM1 要等第 i 个 ACT 把槽释放 —— 约束的两端随在飞数滑动,</text>
  <text x="122" y="224" font-size="5.4" text-anchor="start" fill="#333">不是固定的一对事件, 所以不能写成依赖边。D=1 就是没有双缓冲。</text>
  <text x="122" y="234" font-size="5.4" text-anchor="start" fill="#333">必须同核: GMM1 的结果经 Fixpipe 直给配对的 AIV0, 这条通路只在绑定对内存在,</text>
  <text x="122" y="241" font-size="5.4" text-anchor="start" fill="#333">所以 ACT 的核号被 GMM1 钉住, 不是可以挑的。</text>
  <path d="M0 252 L400 252" fill="none" stroke="#bbb" stroke-width="0.4"/>
  <text x="2" y="266" font-size="7.4" text-anchor="start" font-style="italic">(c)</text>
  <text x="14" y="266" font-size="6.6" text-anchor="start">每个事件排在哪: 前驱算完、核空出来、槽也空出来, 三个条件里最晚的那个</text>
  <text x="57" y="286.4" font-size="5.8" text-anchor="end">AIV1</text>
  <path d="M62 289.6 L348 289.6" fill="none" stroke="#ccc" stroke-width="0.4"/>
  <rect x="62.0" y="280" width="43.741176470588236" height="9" fill="#dcdcdc" stroke="#000" stroke-width="0.5"/>
  <text x="83.87058823529412" y="286.3" font-size="5.2" text-anchor="middle">dispatch 段</text>
  <rect x="284.0705882352941" y="280" width="53.83529411764706" height="9" fill="#dcdcdc" stroke="#000" stroke-width="0.5"/>
  <text x="310.98823529411766" y="286.3" font-size="5.2" text-anchor="middle">combine</text>
  <text x="57" y="299.9" font-size="5.8" text-anchor="end">AIC</text>
  <path d="M62 303.1 L348 303.1" fill="none" stroke="#ccc" stroke-width="0.4"/>
  <rect x="105.74117647058824" y="293.5" width="84.11764705882354" height="9" fill="#dcdcdc" stroke="#000" stroke-width="0.5"/>
  <text x="147.8" y="299.8" font-size="5.2" text-anchor="middle">GMM1 tile</text>
  <rect x="223.50588235294117" y="293.5" width="84.11764705882354" height="9" fill="#dcdcdc" stroke="#000" stroke-width="0.5"/>
  <text x="265.56470588235294" y="299.8" font-size="5.2" text-anchor="middle">GMM1 tile</text>
  <text x="57" y="313.4" font-size="5.8" text-anchor="end">AIV0</text>
  <path d="M62 316.6 L348 316.6" fill="none" stroke="#ccc" stroke-width="0.4"/>
  <rect x="189.85882352941178" y="307.0" width="26.91764705882353" height="9" fill="#dcdcdc" stroke="#000" stroke-width="0.5"/>
  <text x="203.31764705882355" y="313.3" font-size="5.2" text-anchor="middle">ACT</text>
  <text x="57" y="326.9" font-size="5.8" text-anchor="end">AIC</text>
  <path d="M62 330.1 L348 330.1" fill="none" stroke="#ccc" stroke-width="0.4"/>
  <rect x="216.7764705882353" y="320.5" width="67.29411764705883" height="9" fill="#dcdcdc" stroke="#000" stroke-width="0.5"/>
  <text x="250.42352941176472" y="326.8" font-size="5.2" text-anchor="middle">GMM2 tile</text>
  <rect x="189.85882352941178" y="293.5" width="33.64705882352939" height="9" fill="none" stroke="#999" stroke-width="0.5" stroke-dasharray="1.5 1.5"/>
  <text x="206.68235294117648" y="299.8" font-size="4.8" text-anchor="middle" font-style="italic" fill="#555">等槽</text>
  <path d="M216.7764705882353 316.6 L216.7764705882353 303.1" fill="none" stroke="#444" stroke-width="0.5" stroke-dasharray="1.6 1.4"/>
  <path d="M216.7764705882353 303.1 L223.50588235294117 299.5" fill="none" stroke="#444" stroke-width="0.5" stroke-dasharray="1.6 1.4" marker-end="url(#a)"/>
  <text x="226.87058823529412" y="313.5" font-size="5.2" text-anchor="start" fill="#333">ACT 读完释放槽, 下一个 GMM1 才能开始</text>
  <path d="M193.2235294117647 303.1 L193.2235294117647 307.0" fill="none" stroke="#444" stroke-width="0.5"/>
  <text x="196.58823529411765" y="305.0" font-size="5.0" text-anchor="start" fill="#333">同核 (Fixpipe)</text>
  <path d="M337.9058823529412 276 L337.9058823529412 334.5" fill="none" stroke="#000" stroke-width="0.7"/>
  <text x="339.9058823529412" y="274" font-size="5.8" text-anchor="start">端到端耗时 = 最后一个 combine 结束</text>
  <path d="M62 336.5 L354 336.5" fill="none" stroke="#000" stroke-width="0.5"/>
  <text x="62" y="343.5" font-size="5.4" text-anchor="middle">0</text>
  <text x="356" y="338.5" font-size="5.6" text-anchor="start" font-style="italic">时间</text>
  <text x="14" y="362" font-size="5.8" text-anchor="start">排的办法: 对每个还没排的事件, 算出它最早能开始的时刻 = max(前驱都算完, 它要的核空出来); 如果它还要占缓冲槽,</text>
  <text x="14" y="370" font-size="5.8" text-anchor="start">再推迟到槽空出来的那一刻。所有能开始的事件里, 谁最早就先排谁, 一个一个排完整张图。</text>
  <text x="14" y="380" font-size="5.8" text-anchor="start">每个事件被挡的时间分成等前驱 / 等核 / 等槽三份, 加起来就是它开始的时刻 —— 逐阶段汇总就能看出瓶颈是依赖链太长、</text>
  <text x="14" y="388" font-size="5.8" text-anchor="start">核不够, 还是缓冲太浅, 这三件事的改法完全不同。</text>
  <text x="14" y="406" font-size="6.4" text-anchor="start">一份活算多久: 按物理性质分四类</text>
  <rect x="14" y="412" width="372" height="50" fill="none" stroke="#666" stroke-width="0.5" stroke-dasharray="2.5 1.5"/>
  <text x="20" y="422" font-size="5.6" text-anchor="start">dispatch 一段</text>
  <text x="104" y="422" font-size="5.6" text-anchor="start" fill="#333">max(一次往返延迟, 槽内重叠的行的字节时间) + 超出槽数的行按每行节拍串上去</text>
  <text x="20" y="431" font-size="5.6" text-anchor="start">GMM1 / GMM2 一个 tile</text>
  <text x="104" y="431" font-size="5.6" text-anchor="start" fill="#333">双缓冲取 max(载入, 计算); 单缓冲是载入 + 计算 + 每个 K 块的重启</text>
  <text x="20" y="440" font-size="5.6" text-anchor="start">ACT 一个 tile</text>
  <text x="104" y="440" font-size="5.6" text-anchor="start" fill="#333">向量启动开销 + 元素数/向量宽度 x 每向量的 UB 字节 / UB 带宽</text>
  <text x="20" y="449" font-size="5.6" text-anchor="start">combine 一个 tile</text>
  <text x="104" y="449" font-size="5.6" text-anchor="start" fill="#333">读回 + 本卡写 + 跨卡写 (两条带宽差一个量级, 必须分开) + 落点跨度项</text>
  <text x="20" y="458" font-size="5.4" text-anchor="start" fill="#333">载入与计算取 max 不是相加, 是因为它们重叠; 但 GMM 的两股载入 (激活 + 权重) 之间是相加, 这一条由对照实验定的。</text>
  <text x="14" y="478" font-size="6.4" text-anchor="start">MegaMoE 在这套算法里的具体选择</text>
  <rect x="14" y="484" width="372" height="48" fill="none" stroke="#666" stroke-width="0.5" stroke-dasharray="2.5 1.5"/>
  <text x="20" y="494" font-size="5.6" text-anchor="start">五段 dispatch → GMM1 → ACT → GMM2 → combine; GMM1/GMM2 上 AIC, ACT 上 AIV0, dispatch 与 combine 上 AIV1。</text>
  <text x="20" y="503" font-size="5.6" text-anchor="start">GMM1→ACT 这条边既占 UB 槽又必须同核 (Fixpipe 直给); ACT→GMM2 缺省经显存往返, 所以 GMM2 的载入要算激活那一股。</text>
  <text x="20" y="512" font-size="5.6" text-anchor="start">tile 到核的分配在建图时就定死 (编译期按游标分块), 不是运行时抢 —— 换成运行时抢是另一种实现, 要另付一次原子操作。</text>
  <text x="20" y="521" font-size="5.6" text-anchor="start">这些选择换一个取值就重跑一次, 两次的时间差就是这个选择的代价。</text>
  <text x="20" y="530" font-size="5.6" text-anchor="start"></text>
</svg>
