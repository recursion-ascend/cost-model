[project]
name = "moe-cost-model"
version = "0.1.0"
description = "Ascend NPU MegaMoE wave cost model: routing counts -> event DAG -> schedule -> time"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
